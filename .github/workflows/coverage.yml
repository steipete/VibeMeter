name: Code Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  coverage:
    name: Generate Code Coverage
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: |
        sudo xcode-select -s $DEVELOPER_DIR
        xcodebuild -version
        swift --version

    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          build/DerivedData
          ~/.tuist/Cache
          ~/Library/Caches/tuist
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-build-${{ hashFiles('**/Project.swift', '**/Tuist.swift', 'mise.toml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ hashFiles('**/Project.swift', '**/Tuist.swift', 'mise.toml') }}-
          ${{ runner.os }}-build-
      
    - name: Install build tools
      run: |
        # Install mise if not present
        if ! command -v mise &> /dev/null; then
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        fi
        
        # Install Tuist via mise
        mise install
        eval "$(mise activate bash)"
        
    - name: Generate Xcode project
      run: |
        eval "$(mise activate bash)"
        if [[ -x ./scripts/generate-xcproj.sh ]]; then
          ./scripts/generate-xcproj.sh
        else
          echo "Using checked-in VibeMeter.xcodeproj"
          test -d VibeMeter.xcodeproj
        fi
      
    - name: Build and test with coverage
      run: |
        xcodebuild test \
          -workspace VibeMeter.xcworkspace \
          -scheme VibeMeter \
          -configuration Debug \
          -derivedDataPath build/DerivedData \
          -enableCodeCoverage YES \
          -resultBundlePath TestResults.xcresult \
          -quiet
          
    - name: Generate coverage report
      run: |
        # Extract coverage percentage
        COVERAGE=$(xcrun xccov view --report --only-targets TestResults.xcresult | grep "VibeMeter.app" | awk '{print $3}')
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        
        # Generate detailed report
        xcrun xccov view --report TestResults.xcresult > coverage.txt
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./TestResults.xcresult
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Create coverage badge
      if: env.COVERAGE != '' && env.GIST_SECRET != '' && env.COVERAGE_BADGE_GIST_ID != ''
      uses: schneegans/dynamic-badges-action@v1.7.0
      env:
        GIST_SECRET: ${{ secrets.GIST_SECRET }}
        COVERAGE_BADGE_GIST_ID: ${{ vars.COVERAGE_BADGE_GIST_ID }}
      with:
        auth: ${{ env.GIST_SECRET }}
        gistID: ${{ env.COVERAGE_BADGE_GIST_ID }}
        filename: vibemeter-coverage.json
        label: Coverage
        message: ${{ env.COVERAGE }}
        color: |
          ${{
            startsWith(env.COVERAGE, '9') && 'brightgreen' ||
            startsWith(env.COVERAGE, '8') && 'green' ||
            startsWith(env.COVERAGE, '7') && 'yellowgreen' ||
            startsWith(env.COVERAGE, '6') && 'yellow' ||
            'red'
          }}
          
    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const coverage = process.env.COVERAGE;
          const body = `## 📊 Code Coverage Report
          
          **Overall Coverage:** ${coverage}
          
          <details>
          <summary>View detailed report</summary>
          
          \`\`\`
          ${require('fs').readFileSync('coverage.txt', 'utf8').slice(0, 3000)}
          \`\`\`
          </details>`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          })
          
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          TestResults.xcresult
          coverage.txt
